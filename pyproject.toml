[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careeros"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
careeros = "careeros.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["careeros"]
artifacts = ["careeros/templates/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
